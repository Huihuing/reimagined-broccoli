<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>새 글 작성 - Mini Watch 게시판</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container narrow">
    <p class="eyebrow">NEW POST</p>
    <h1>새 글 작성</h1>

    {% if error %}
      <p class="error-message" role="alert">{{ error }}</p>
    {% endif %}

    <form class="post-form" method="post">
      <label for="title">제목</label>
      <input id="title" name="title" type="text" value="{{ title }}" required>

      <label for="body">내용</label>
      <textarea id="body" name="body" rows="10" required>{{ body }}</textarea>

      <div class="actions">
        <a class="button" href="{{ url_for('posts.index') }}">취소</a>
        <button class="button primary" type="submit">저장하기</button>
      </div>
    </form>
  </main>
</body>
</html>
