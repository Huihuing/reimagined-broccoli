<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>일반 게시판 로그인</title>
<link rel="stylesheet" href="/static/style.css"></head><body><main>
<h1>일반 게시판 로그인</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<label>아이디 <input name="username" autocomplete="username" required></label>
<label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">로그인</button>
</form><p><a href="/">게시판으로 돌아가기</a></p></main></body></html>
