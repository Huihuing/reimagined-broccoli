<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.id }}번 글 삭제 - Mini Watch 게시판</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container narrow">
    <section class="confirm-card">
      <p class="eyebrow">DELETE POST #{{ post.id }}</p>
      <h1>게시글 삭제</h1>
      <p><strong>{{ post.title }}</strong> 글을 정말 삭제하시겠습니까?</p>
      <p class="muted">확인 버튼을 눌러야 실제로 삭제됩니다.</p>

      <form method="post">
        <div class="actions">
          <a class="button" href="{{ url_for('posts.detail', post_id=post.id) }}">취소</a>
          <button class="button danger" type="submit">삭제 확인</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
