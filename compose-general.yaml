name: rb-general
services:
  general-db:
    image: postgres:16
    environment:
      POSTGRES_DB: general_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-only-postgres
    volumes:
      - general-data:/var/lib/postgresql/data
      - ./general/sql/deploy.sql:/docker-entrypoint-initdb.d/01-deploy.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d general_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [general-data-net]
  general-api:
    build: ./general
    environment:
      DB_HOST: general-db
      DB_PORT: "5432"
      DB_NAME: general_db
      DB_USER: postgres
      DB_PASSWORD: local-only-postgres
      DB_SSLMODE: prefer
      SECRET_KEY: local-only-general-session-key-not-for-cloud
      SESSION_COOKIE_SECURE: "false"
      EVENT_TOKEN: local-only-shared-event-token-not-for-cloud
      MONITOR_URL: http://monitor-api:5000/api/events
      ENABLE_SENTRY_TEST: "false"
    depends_on:
      general-db:
        condition: service_healthy
    networks: [general-data-net, general-front-net, events-net]
  general-gateway:
    image: nginx:alpine
    volumes:
      - ./gateways/general.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8081:80"]
    depends_on: [general-api]
    networks: [general-front-net]
volumes:
  general-data:
networks:
  general-data-net: {}
  general-front-net: {}
  events-net:
    external: true
    name: rb-events
