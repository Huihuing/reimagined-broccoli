name: Verify monitoring dashboard assignment

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mini_watch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_watch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: mini_watch
      DB_USER: postgres
      DB_PASSWORD: postgres
      MONITOR_URL: http://127.0.0.1:5200/api/events
      SESSION_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r general/requirements.txt
          pip install -r monitor/backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q general monitor/backend

      - name: Prepare PostgreSQL schema
        working-directory: general
        run: |
          python - <<'PY'
          from pathlib import Path
          from db import connect_db

          sql_files = [
              Path("sql/001_create_posts.sql"),
              Path("../monitor/backend/sql/001_monitor.sql"),
          ]

          with connect_db() as conn:
              for sql_file in sql_files:
                  statements = [
                      statement.strip()
                      for statement in sql_file.read_text(encoding="utf-8").split(";")
                      if statement.strip()
                  ]
                  for statement in statements:
                      conn.execute(statement)
              conn.commit()
          PY

      - name: Verify monitoring backend API
        working-directory: monitor/backend
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_api.py

      - name: Prepare integration operator account
        working-directory: monitor/backend
        env:
          PYTHONPATH: .
        run: |
          python create_user.py --username admin --name "운영자" --password test-password

      - name: Start monitoring API
        working-directory: monitor/backend
        env:
          PYTHONPATH: .
        run: |
          python app.py > /tmp/mini-watch-monitor.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:5200/health", timeout=0.5) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(0.25)
          else:
              raise SystemExit("monitor API did not start")
          PY

      - name: Verify existing general board CRUD and event sending
        working-directory: general
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_posts.py

      - name: Verify collected events through authenticated API
        run: |
          python - <<'PY'
          import requests

          session = requests.Session()

          blank = session.post(
              "http://127.0.0.1:5200/api/auth/login",
              json={"username": "", "password": ""},
              timeout=2,
          )
          assert blank.status_code == 400

          wrong = session.post(
              "http://127.0.0.1:5200/api/auth/login",
              json={"username": "admin", "password": "wrong"},
              timeout=2,
          )
          assert wrong.status_code == 401

          login = session.post(
              "http://127.0.0.1:5200/api/auth/login",
              json={"username": "admin", "password": "test-password"},
              timeout=2,
          )
          login.raise_for_status()

          events = session.get(
              "http://127.0.0.1:5200/api/events",
              timeout=2,
          )
          events.raise_for_status()
          payload = events.json()
          assert payload["summary"]["total"] > 0, payload
          assert any(item["path"].startswith("/board") or item["path"] == "/" for item in payload["events"])

          filtered = session.get(
              "http://127.0.0.1:5200/api/events",
              params={"status": 404},
              timeout=2,
          )
          filtered.raise_for_status()

          logout = session.post(
              "http://127.0.0.1:5200/api/auth/logout",
              timeout=2,
          )
          logout.raise_for_status()

          protected = session.get(
              "http://127.0.0.1:5200/api/events",
              timeout=2,
          )
          assert protected.status_code == 401
          PY

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: monitor/frontend/package-lock.json

      - name: Install Vite React dependencies
        working-directory: monitor/frontend
        run: npm ci

      - name: Build React dashboard
        working-directory: monitor/frontend
        run: npm run build
